name: C backend CI
on:
  push:
    branches: [rewrite/c-backend, feature/battery-domain-models]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libmicrohttpd-dev libcjson-dev libssl-dev curl clang-format python3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Format source code
        run: |
          chmod +x scripts/format.sh
          ./scripts/format.sh --write
          ./scripts/format.sh --check
      - name: Configure
        run: cmake -S backend-c -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Unit and HTTP integration tests
        run: ctest --test-dir build --output-on-failure
      - name: Configure AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake -S backend-c -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build sanitizer targets
        run: cmake --build build-sanitize --parallel
      - name: Run sanitized unit tests
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ctest --test-dir build-sanitize --output-on-failure \
            -R 'bms_core_tests|battery_diagnostics_tests|battery_domain_tests|battery_fleet_tests|battery_fleet_domain_integration_tests|battery_repository_tests|battery_service_tests|battery_service_adversarial_tests|authentication_tests|bms_edge_case_tests'
      - name: HTTP smoke test
        shell: bash
        env:
          BMS_AUTH_USERNAME: ci_test
          BMS_AUTH_PASSWORD: ci_test_password_123
          BMS_SESSION_SECRET: ci_test_session_secret_12345678901234567890
          BMS_DEVICE_TOKEN: ci_test_device_token
        run: |
          set -Eeuo pipefail

          PORT=18080 ./build/bms-server > /tmp/bms.log 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "Waiting for backend health endpoint..."
          for attempt in {1..30}; do
            if curl --silent --show-error --fail http://127.0.0.1:18080/health -o /tmp/health.json; then
              break
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Backend exited before becoming healthy."
              cat /tmp/bms.log
              exit 1
            fi
            sleep 1
          done

          if [[ ! -s /tmp/health.json ]]; then
            echo "Backend failed to become healthy within 30 seconds."
            cat /tmp/bms.log
            exit 1
          fi

          grep -q '"implementation":"c"' /tmp/health.json
          echo "PASS: unauthenticated health endpoint"

          unauthenticated_status=$(curl --silent --show-error -o /tmp/unauthenticated.json -w '%{http_code}' http://127.0.0.1:18080/data)
          test "$unauthenticated_status" = "401"
          echo "PASS: dashboard data rejects unauthenticated requests"

          set +e
          login_status=$(curl --silent --show-error -D /tmp/login.headers -o /tmp/login.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$BMS_AUTH_USERNAME\",\"password\":\"$BMS_AUTH_PASSWORD\"}" \
            http://127.0.0.1:18080/auth/login 2>/tmp/login.curl-error)
          login_curl_exit=$?
          set -e
          if [[ "$login_curl_exit" -ne 0 || "$login_status" != "200" ]]; then
            echo "FAIL: dashboard login curl exit=$login_curl_exit HTTP=${login_status:-no-response}"
            echo "curl stderr:"
            cat /tmp/login.curl-error
            echo "Login response body:"
            cat /tmp/login.json
            echo
            echo "Login response headers:"
            cat /tmp/login.headers
            echo
            echo "Backend log:"
            cat /tmp/bms.log
            exit 1
          fi

          session_cookie=$(sed -n 's/^Set-Cookie: __Host-bms_session=\([^;]*\).*/\1/ip' /tmp/login.headers | tr -d '\r' | head -n 1)
          csrf_token=$(python3 -c 'import json; print(json.load(open("/tmp/login.json"))["csrf_token"])')
          test -n "$session_cookie"
          test "${#csrf_token}" -eq 64
          cookie_header="__Host-bms_session=$session_cookie; __Host-bms_csrf=$csrf_token"
          echo "PASS: dashboard login issues session and CSRF credentials"

          invalid_device_status=$(curl --silent --show-error -o /tmp/invalid-device.json -w '%{http_code}' \
            -X POST http://127.0.0.1:18080/update \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer invalid-token' \
            -d '{"voltage":3.7,"current":0.1,"temperature":25,"time":1,"hardware_connection":true}')
          test "$invalid_device_status" = "401"
          echo "PASS: telemetry endpoint rejects invalid device token"

          curl --silent --show-error --fail -X POST http://127.0.0.1:18080/update \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $BMS_DEVICE_TOKEN" \
            -d '{"voltage":3.7,"current":0.1,"temperature":25,"time":1,"hardware_connection":true}' \
            -o /tmp/update.json
          echo "PASS: valid device telemetry accepted"

          curl --silent --show-error --fail http://127.0.0.1:18080/data \
            -H "Cookie: $cookie_header" -o /tmp/data.json
          grep -q '"voltage":3.7' /tmp/data.json
          echo "PASS: authenticated dashboard reads updated telemetry"

          control_status=$(curl --silent --show-error -o /tmp/charge.json -w '%{http_code}' \
            -X POST http://127.0.0.1:18080/charge \
            -H "Cookie: $cookie_header" \
            -H "X-CSRF-Token: $csrf_token")
          test "$control_status" = "503"
          echo "PASS: charge command remains disabled (HTTP 503)"

          echo "All HTTP smoke checks passed."
