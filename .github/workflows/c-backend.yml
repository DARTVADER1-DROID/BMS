name: C backend CI
on:
  push:
    branches: [rewrite/c-backend]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libmicrohttpd-dev libcjson-dev curl
      - name: Configure
        run: cmake -S backend-c -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: HTTP smoke test
        shell: bash
        run: |
          PORT=18080 ./build/bms-server > /tmp/bms.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/health >/tmp/health.json; then break; fi
            sleep 1
          done
          grep -q '"implementation":"c"' /tmp/health.json
          curl -fsS -X POST http://127.0.0.1:18080/update -H 'Content-Type: application/json' -d '{"voltage":3.7,"current":0.1,"temperature":25,"time":1,"hardware_connection":true}' >/tmp/update.json
          curl -fsS http://127.0.0.1:18080/data | grep -q '"voltage":3.7'
          status=$(curl -sS -o /tmp/charge.json -w '%{http_code}' -X POST http://127.0.0.1:18080/charge)
          test "$status" = "503"
